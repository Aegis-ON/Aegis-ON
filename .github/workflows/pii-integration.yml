name: PII model integration

on:
  pull_request:
    paths:
      - 'src/aegis_on/pii*.py'
      - 'tests/test_pii*.py'
      - 'evaluation/pii_synthetic_v1.json'
      - 'requirements-pii.txt'
      - '.github/workflows/pii-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-model:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local CPU inference dependencies
        run: python -m pip install -r requirements.txt -r requirements-pii.txt
      - name: Prepare pinned public model snapshot
        run: >-
          python -c "from huggingface_hub import snapshot_download;
          snapshot_download(repo_id='YATAV-ENT/aegis-personal-pii-ner',
          revision='3a1d4f61e156035a22d820b59c78e4d5e5cc6f6f',
          local_dir='/tmp/aegis-pii-v2',
          allow_patterns=['config.json','tokenizer.json','tokenizer_config.json',
          'special_tokens_map.json','vocab.txt','onnx/model_quantized.onnx'])"
      - name: Run real inference integration tests
        env:
          AEGIS_PII_MODEL_DIR: /tmp/aegis-pii-v2
          AEGIS_PII_INTEGRATION: '1'
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_pii_real_model.py' -v
      - name: Evaluate synthetic PII spans
        env:
          AEGIS_PII_MODEL_DIR: /tmp/aegis-pii-v2
          PYTHONPATH: src
        run: |
          python -m aegis_on.pii_evaluation --dataset evaluation/pii_synthetic_v1.json --output /tmp/pii-evaluation.json
          python -c "import json; r=json.load(open('/tmp/pii-evaluation.json')); assert r['model_only']['available'], 'real model evaluation unavailable'; print(json.dumps(r, ensure_ascii=True))"
