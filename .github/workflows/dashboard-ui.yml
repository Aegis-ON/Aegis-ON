name: Dashboard UI

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'static/astryx/**'
      - '.github/workflows/dashboard-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dom-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Test and rebuild
        working-directory: frontend
        run: npm test
      - name: Check committed assets
        run: git diff --exit-code -- static/astryx/app.js static/astryx/app.css
