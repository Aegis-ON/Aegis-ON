<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0e11"><title>로그인 · Aegis-ON</title><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0a0e11;color:#eef3f1}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.login{width:min(100%,420px);padding:32px;background:#12191e;border:1px solid #2a373d;border-radius:5px}h1{font-size:22px;margin:0 0 8px}p{color:#aab8b9;line-height:1.6}label{display:block;margin:20px 0 7px;font-weight:600}input,button{font:inherit;width:100%;min-height:46px;border-radius:4px}input{background:#0e171a;border:1px solid #46595a;color:#fff;padding:10px}button{margin-top:24px;background:#ed7167;border:1px solid #ed7167;color:#160e0d;font-weight:700;cursor:pointer}button:disabled{opacity:.6}input:focus-visible,button:focus-visible{outline:3px solid #f7a69e;outline-offset:3px}#status{min-height:24px;color:#ffb7ae}.meta{font-size:12px}
body{background:radial-gradient(ellipse at 50% 0,#122541 0,#080c13 58%)}.login{background:#101622;border-color:#293a50;box-shadow:0 18px 60px #0009;border-radius:10px}input{background:#0b101a;border-color:#394d63}button{background:#74d7ea;border-color:#74d7ea;color:#061317}input:focus-visible,button:focus-visible{outline-color:#8be7f4}
</style></head><body><main class="login"><h1>Aegis-ON 관제 로그인</h1><p>서버 운영자가 설정한 분석가 계정으로 로그인하세요.</p><form id="login"><label for="username">아이디</label><input id="username" name="username" autocomplete="username" required maxlength="100"><label for="password">비밀번호</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024"><button type="submit">로그인</button><p id="status" role="status" aria-live="polite"></p></form><p class="meta">계정은 서버 운영자가 설정합니다. 회원가입 기능은 제공하지 않습니다.</p></main><script>
'use strict';document.querySelector('#login').addEventListener('submit',async e=>{e.preventDefault();const form=e.currentTarget,button=form.querySelector('button'),status=document.querySelector('#status');button.disabled=true;status.textContent='로그인 중…';try{const response=await fetch('/api/v1/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:form.username.value,password:form.password.value})});form.password.value='';if(!response.ok){status.textContent=response.status===401?'아이디 또는 비밀번호가 올바르지 않습니다.':'로그인 설정 또는 서버 연결을 확인하세요.';return}location.assign('/')}catch{status.textContent='서버에 연결하지 못했습니다.'}finally{button.disabled=false}});
</script></body></html>
