:root{color-scheme:dark;--bg:#0a0e11;--panel:#12191e;--panel2:#172126;--line:#2a373d;--ink:#eef3f1;--muted:#aab8b9;--accent:#f57469;--good:#7dd9b2;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-size:14px}a{color:inherit;text-decoration:none}button,input,select{font:inherit}button,a,input,select{outline-offset:3px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #f7a69e}.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}.side{background:#0f1518;border-right:1px solid var(--line);padding:25px 16px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-size:19px;font-weight:800;letter-spacing:-.04em;padding:0 10px 35px}.brand i{display:inline-grid;place-items:center;border:1px solid var(--accent);width:27px;height:27px;color:var(--accent);font-style:normal;font-size:14px;margin-right:9px}.side-label{color:#819191;font-size:10px;font-weight:700;letter-spacing:.13em;margin:14px 12px}.nav a{display:block;padding:13px 12px;border:1px solid transparent;border-radius:5px;color:#bac8c7}.nav a:hover,.nav a[aria-current=page]{background:#1b282b;color:white;border-color:#35474a}.nav span{display:inline-block;width:25px;color:#94aaa8}.side-foot{border-top:1px solid var(--line);margin:32px 10px 0;padding-top:20px;font-size:12px;line-height:1.7;color:#9aabaa}.side-foot b{color:#e3c3a2}.main{min-width:0}.top{height:68px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 35px;border-bottom:1px solid var(--line);background:#0e1518}.top strong{font-size:13px}.top small{color:#a9bbb8}.content{max-width:1510px;margin:auto;padding:38px 35px 70px}.kicker{text-transform:uppercase;font-size:11px;font-weight:750;letter-spacing:.15em;color:var(--accent)}h1{font-size:30px;letter-spacing:-.04em;margin:10px 0 9px}.sub{color:var(--muted);line-height:1.7;margin:0;max-width:850px}.pagehead{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:27px}.action{border:1px solid #536767;background:#223134;color:#eef8f4;border-radius:4px;padding:10px 15px;min-height:42px;cursor:pointer;font-weight:700}.action:hover{background:#2c4042}.action.primary{background:#ed7167;color:#160e0d;border-color:#ed7167}.action:disabled{opacity:.55;cursor:not-allowed}.state{color:#c8d7d4;background:#142022;border:1px solid #324642;padding:14px 16px;line-height:1.55;margin:20px 0;border-radius:4px;overflow-wrap:anywhere}.state.error{border-color:#9a4f4a;color:#ffccc5;background:#2b1b1b}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.metric,.panel{background:var(--panel);border:1px solid var(--line);border-radius:5px}.metric{padding:18px;min-height:112px}.metric span,.meta{color:var(--muted);font-size:12px}.metric b{display:block;font-size:28px;margin-top:15px}.metric i{font-size:12px;font-style:normal;color:#9eb0ad;margin-left:5px}.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:16px;margin-top:16px}.panel{padding:20px;min-width:0}.panel h2{font-size:16px;margin:0 0 8px}.panel p{line-height:1.65}.panel-head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}.panel-head h2{margin:0}.panel-head a{color:#f3a49a;font-size:12px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;text-align:left;min-width:560px}.table th{color:#9fb0ae;font-size:11px;letter-spacing:.04em;font-weight:650;text-transform:uppercase;border-bottom:1px solid var(--line);padding:11px}.table td{padding:13px 11px;border-bottom:1px solid #243136;vertical-align:top;line-height:1.45;overflow-wrap:anywhere}.table tr:last-child td{border:0}.table a,.link-button{color:#f3a49a;text-align:left}.link-button{background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}.tag{display:inline-flex;border:1px solid #46585a;padding:4px 8px;font-size:11px;color:#c6d8d3;border-radius:3px;white-space:nowrap}.tag.high{background:#432422;border-color:#8b4740;color:#ffd0ca}.tag.medium{background:#3a301c;border-color:#786238;color:#ffe1a7}.tag.low{background:#1b3730;border-color:#365f52;color:#c4f2df}.empty{padding:27px;color:var(--muted);border:1px dashed #394a4b;text-align:center;line-height:1.6}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.filters label{color:#b9c8c6;font-size:12px}.filters select,.filters input{display:block;margin-top:7px;background:#0e171a;color:#f3f6f5;border:1px solid #46595a;border-radius:4px;min-height:42px;padding:8px;max-width:100%}.detail{margin-top:16px;border-left:3px solid #ed7167}.detail h3{margin:0 0 8px;font-size:17px}.detail ul{padding-left:20px;line-height:1.8}.detail p,.detail li,.wrap-any{overflow-wrap:anywhere}.stack>*+*{margin-top:13px}.muted{color:var(--muted)}.footer{padding-top:24px;color:#91a3a1;font-size:12px;line-height:1.6}.bar{display:flex;gap:8px;flex-wrap:wrap}.skip{position:absolute;top:-100px;left:10px;background:white;color:#101010;padding:10px;z-index:10}.skip:focus{top:8px}.warning{border-left:3px solid #e0ae67;padding-left:12px;color:#d6c3a5;font-size:12px;line-height:1.7}@media(max-width:900px){.grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){.shell{display:block}.side{position:static;height:auto;padding:14px 16px;border-right:0;border-bottom:1px solid var(--line)}.brand{padding:0 0 12px}.side-label,.side-foot{display:none}.nav{display:flex;gap:3px;overflow-x:auto}.nav a{white-space:nowrap;padding:10px}.nav span{width:20px}.top{padding:0 17px}.content{padding:25px 16px 45px}.pagehead{align-items:start;flex-direction:column}.metrics{gap:8px}.metric{min-height:95px;padding:14px}.metric b{font-size:23px}.panel{padding:15px}.filters>*{flex:1 1 140px}}
</style></head><body><a class="skip" href="#main">본문으로 건너뛰기</a><div class="shell"><aside class="side" aria-label="관제 메뉴"><div class="brand"><a href="/" aria-label="Aegis-ON 제품 소개"><i>A</i>Aegis-ON</a></div><div class="side-label">WORKSPACE</div><nav class="nav"><a href="/console" data-page="overview"><span>▦</span>관제 개요</a><a href="/console/endpoints" data-page="endpoints"><span>◇</span>엔드포인트</a><a href="/console/detections" data-page="detections"><span>▤</span>탐지 결과</a><a href="/console/analysis" data-page="analysis"><span>⊕</span>로그 분석</a><a href="/console/history" data-page="history"><span>◷</span>분석 이력</a></nav><div class="side-foot"><b>로컬 분석 · 수동 실행</b><br>에이전트 연결 상태는 수집하지 않습니다.<br><br><a href="/">← 제품 소개</a></div></aside><div class="main"><header class="top"><strong>보안 이벤트 관제</strong><small>LOCAL / MANUAL</small></header><main class="content" id="main"><div class="pagehead"><div><div class="kicker" id="kicker">OVERVIEW</div><h1 id="title">관제 개요</h1><p class="sub" id="subtitle">저장된 분석 이력에서 확인 가능한 정보입니다.</p></div><div class="bar"><a class="action" href="/console/analysis">＋ 로그 분석</a><button class="action primary" id="load" type="button">인증하고 불러오기</button></div></div><div id="status" class="state" role="status" aria-live="polite">API 토큰으로 인증하면 로컬 분석 이력을 불러옵니다.</div><div id="view"></div><div class="footer">로컬에 저장된 가명처리 정보에도 민감한 값이 남을 수 있습니다. 승인 조치는 시뮬레이션이며 실제 차단이나 실시간 수집을 수행하지 않습니다.</div></main></div></div>
<script>
'use strict';
const pagePath=location.pathname.replace(/\/$/,'')||'/console';
const endpointPrefix='/console/endpoints/';
const page=pagePath.startsWith(endpointPrefix)?'endpoint':pagePath==='/console/endpoints'?'endpoints':pagePath==='/console/detections'?'detections':pagePath==='/console/history'?'history':'overview';
const titles={overview:['OVERVIEW','관제 개요','저장된 분석 이력에서 확인 가능한 정보입니다.'],endpoints:['ENDPOINTS','관찰된 엔드포인트','한 분석 안에서 확인된 호스트 단위입니다. 서로 다른 분석의 장치 동일성은 확정하지 않습니다.'],endpoint:['ENDPOINT DETAIL','엔드포인트 상세','이 분석의 가명처리된 이벤트와 관련 탐지 결과입니다.'],detections:['DETECTIONS','탐지 결과','규칙·키워드·상관분석 결과와 관련 이벤트를 확인합니다.'],history:['ANALYSIS HISTORY','분석 이력','저장된 분석과 승인 시뮬레이션을 확인합니다.']};
const [k,title,subtitle]=titles[page];document.querySelector('#kicker').textContent=k;document.querySelector('#title').textContent=title;document.querySelector('#subtitle').textContent=subtitle;document.querySelector(`[data-page="${page==='endpoint'?'endpoints':page}"]`)?.setAttribute('aria-current','page');
const statusEl=document.querySelector('#status'),view=document.querySelector('#view'),load=document.querySelector('#load');
let detailEpoch=0;
function node(tag,text,cls){const e=document.createElement(tag);if(text!==undefined&&text!==null)e.textContent=String(text);if(cls)e.className=cls;return e}
function link(text,href){const e=node('a',text);e.href=href;return e}
function state(text,error=false){statusEl.textContent=text;statusEl.className=error?'state error':'state'}
function fmt(v){return v===undefined||v===null||v===''?'확인 불가':String(v)}
function scoreTag(score){const n=Number(score);return node('span',n>=70?'높음':n>=40?'중간':'낮음','tag '+(n>=70?'high':n>=40?'medium':'low'))}
function source(s){return ({rule:'규칙',correlation:'상관분석','semantic-baseline':'키워드 기준선'})[s]||fmt(s)}
function table(headers){const wrap=node('div',null,'table-wrap'),t=node('table',null,'table'),h=node('thead'),tr=node('tr'),body=node('tbody');for(const label of headers)tr.append(node('th',label));h.append(tr);t.append(h,body);wrap.append(t);return {wrap,body}}
function row(body,cells){let tr=node('tr');for(const cell of cells){let td=node('td');if(cell instanceof Node)td.append(cell);else td.textContent=fmt(cell);tr.append(td)}body.append(tr)}
function panel(title){let e=node('section',null,'panel');e.append(node('h2',title));return e}
function empty(text){return node('div',text,'empty')}
function tokenPrompt(){return window.prompt('설정한 Aegis-ON API 토큰을 입력하세요.')?.trim()||null}
async function get(path,token,options={}){const r=await fetch(path,{...options,headers:{Authorization:`Bearer ${token}`,...options.headers}});if(!r.ok)throw new Error(r.status===401?'인증 실패: API 토큰을 확인하세요.':r.status===503?'로컬 이력 저장소 또는 모델 상태를 확인하세요.':`요청 실패 (HTTP ${r.status})`);return r.json()}
function batchByDetection(data,id){return data.analyses.find(a=>(a.detection_ids||[]).includes(id))}
function evidencePanel(det,batch,token){let box=panel('탐지 상세');box.classList.add('detail');box.append(node('h3',`${fmt(det.technique)} · ${fmt(det.title)}`));box.append(node('p',`출처 ${source(det.source)} · 점수 ${fmt(det.score)} · 호스트 ${fmt(det.host)}`,'meta'));box.append(node('p','탐지 근거'));let ul=node('ul');for(const x of det.evidence||[])ul.append(node('li',x));if(!ul.childNodes.length)ul.append(node('li','저장된 근거 없음'));box.append(ul,node('p','관련 이벤트 식별 정보 · 가명처리된 메타데이터','meta'));let events=(batch?.source_events?.length?batch.source_events:batch?.event_refs)||[];let related=events.filter(e=>(det.event_ids||[]).includes(e.event_id));if(!related.length)box.append(node('p','저장된 이벤트 연결 정보가 없습니다.','muted'));for(const e of related)box.append(node('p',`입력 ${fmt(e.input_index)} · 이벤트 ${fmt(e.event_id)} · 발생 시각 ${fmt(e.timestamp)} · 출처 ${fmt(e.log_source)}`,'wrap-any'));box.append(node('p',`상태: ${fmt(det.status)} · 승인 조치는 시뮬레이션입니다.`));if(det.approval)box.append(node('p',`처리 ${fmt(det.approval.approved_at)} · 분석가 ${fmt(det.approval.analyst)} · 사유 ${fmt(det.approval.rationale)}`,'muted'));if(det.status!=='approved_for_simulated_response'){const b=node('button','시뮬레이션 승인','action');b.type='button';b.addEventListener('click',async()=>{const analyst=window.prompt('설정한 분석가 이름을 입력하세요.');if(!analyst)return;const rationale=window.prompt('승인 사유를 입력하세요. 비밀값은 입력하지 마세요.');if(rationale===null)return;b.disabled=true;try{const result=await get(`/api/v1/detections/${encodeURIComponent(det.detection_id)}/approval`,token,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({analyst:analyst.trim(),rationale})});if(result.simulation_only!==true)throw new Error('시뮬레이션 결과를 확인하지 못했습니다.');state('승인 시뮬레이션이 저장됐습니다. 실제 차단은 수행하지 않았습니다.');await refresh(token)}catch(e){state(e.message,true);b.disabled=false}});box.append(b)}return box}
function recent(data){let t=table(['심각도','탐지 / 유형','분석 시각','출처']);for(const d of data.detections.slice(0,8)){const a=batchByDetection(data,d.detection_id);row(t.body,[scoreTag(d.score),link(`${fmt(d.technique)} · ${fmt(d.title)}`,'/console/detections'),a?.analyzed_at,source(d.source)])}return data.detections.length?t.wrap:empty('저장된 탐지 결과가 없습니다.')}
function historyTable(data,token){const t=table(['분석 시각','입력','처리','탐지','분석 ID']);for(const a of data.analyses){let processed=a.summary?.processed,b=node('button',fmt(a.analysis_id),'link-button');b.type='button';b.addEventListener('click',async()=>{const request=++detailEpoch;for(const id of ['#history-detail','#detail']){const old=document.querySelector(id);if(old)old.remove()}try{const fresh=await get('/api/v1/history',token);if(request!==detailEpoch)return;const batch=fresh.analyses.find(x=>x.analysis_id===a.analysis_id);if(!batch)throw new Error('분석 이력을 찾을 수 없습니다.');let old=document.querySelector('#history-detail');if(old)old.remove();let detail=panel('분석 상세');detail.id='history-detail';detail.classList.add('detail');detail.append(node('p',`분석 ${fmt(batch.analysis_id)} · ${fmt(batch.analyzed_at)} · ${fmt(batch.input_type)}`,'wrap-any'));const events=batch.source_events?.length?batch.source_events:(batch.event_refs||[]);detail.append(node('p',`가명처리된 이벤트 식별 정보 ${events.length}건`));for(const event of events)detail.append(node('p',`입력 ${fmt(event.input_index)} · ID ${fmt(event.event_id)} · 시각 ${fmt(event.timestamp)} · 출처 ${fmt(event.log_source)}`,'meta wrap-any'));for(const d of fresh.detections.filter(x=>(batch.detection_ids||[]).includes(x.detection_id))){let btn=node('button',`${fmt(d.title)} · ${fmt(d.status)}`,'link-button');btn.type='button';btn.addEventListener('click',async()=>{const request=++detailEpoch;try{let now=await get('/api/v1/history',token);if(request!==detailEpoch)return;let latest=now.detections.find(x=>x.detection_id===d.detection_id);if(!latest)throw new Error('탐지 결과를 찾을 수 없습니다.');let prev=document.querySelector('#detail');if(prev)prev.remove();let panel=evidencePanel(latest,batchByDetection(now,latest.detection_id),token);panel.id='detail';view.append(panel);panel.scrollIntoView({block:'start'})}catch(e){if(request===detailEpoch)state(e.message,true)}});detail.append(btn,node('p',`${source(d.source)} · ${fmt(d.score)}점`,'meta'))}if(!(batch.detection_ids||[]).length)detail.append(node('p','관련 탐지 없음','muted'));view.append(detail);detail.scrollIntoView({block:'start'})}catch(e){if(request===detailEpoch)state(e.message,true)}});row(t.body,[a.analyzed_at,a.input_type,processed,(a.detection_ids||[]).length,b])}return data.analyses.length?t.wrap:empty('아직 저장된 분석 이력이 없습니다.')}
function metric(label,value,detail){const e=node('div',null,'metric');e.append(node('span',label),node('b',value),node('span',detail));return e}
function renderOverview(data,endpoints,pii,attack,token){let metrics=node('section',null,'metrics');let d=data.detections;metrics.append(metric('저장된 분석',data.analyses.length,'전체 이력'),metric('저장된 탐지',d.length,'전체 이력'),metric('높은 심각도',d.filter(x=>Number(x.score)>=70).length,'점수 70 이상'),metric('호스트 관찰 묶음',endpoints.endpoints.length,'분석 단위 · 장치 수 아님'));view.append(metrics);let grid=node('div',null,'grid'),p=panel('최근 탐지');p.append(recent(data));let q=panel('심각도 및 모델 상태');q.append(node('p',`높음 ${d.filter(x=>Number(x.score)>=70).length} · 중간 ${d.filter(x=>Number(x.score)>=40&&Number(x.score)<70).length} · 낮음 ${d.filter(x=>Number(x.score)<40).length}`),node('p',`개인정보 탐지: ${fmt(pii.state)} · 정규식은 별도 적용`),node('p',`공격 분석 모델: ${fmt(attack.state)} · 실험용 이진 분류`),node('p','모델 점수는 실제 공격 확률이 아닙니다. 실시간 수집 및 실제 차단은 제공하지 않습니다.','warning'));grid.append(p,q);view.append(grid);let hosts=panel('최근 호스트 관찰');const hostTable=table(['호스트 표시','관련 탐지','분석 시각']);for(const e of endpoints.endpoints.slice(0,5))row(hostTable.body,[link(fmt(e.host),'/console/endpoints/'+encodeURIComponent(e.endpoint_id)),e.detection_count,e.analyzed_at]);hosts.append(endpoints.endpoints.length?hostTable.wrap:empty('관찰된 호스트 정보가 없습니다.'));hosts.style.marginTop='16px';view.append(hosts);let h=panel('최근 분석 이력');h.style.marginTop='16px';h.append(historyTable({analyses:data.analyses.slice(0,5)},token));view.append(h)}
function renderEndpoints(data){view.append(node('p','호스트가 없거나 표시값이 불명확한 이벤트는 미상으로 분류합니다. 같은 가명도 실제 동일 장치라는 뜻은 아닙니다.','warning'));let p=panel('분석별 호스트 관찰'),t=table(['호스트 표시','이벤트','탐지','최고 심각도','마지막 이벤트','분석 시각']);for(const e of data.endpoints){row(t.body,[link(fmt(e.host),'/console/endpoints/'+encodeURIComponent(e.endpoint_id)),e.event_count,e.detection_count,e.highest_score==null?'없음':scoreTag(e.highest_score),e.last_seen,e.analyzed_at])}p.append(data.endpoints.length?t.wrap:empty('분석 이력에 관찰된 호스트 정보가 없습니다.'));view.append(p)}
function renderEndpoint(data,token){const e=data.endpoint;view.append(node('p',`호스트 ${fmt(e.host)} · 분석 ${fmt(e.analysis_id)} · 분류 ${fmt(e.attribution)} · 연결 상태 미수집`,'warning'));let grid=node('div',null,'grid'),p=panel('관련 이벤트'),t=table(['입력','이벤트 ID','시각','출처']);for(const x of data.events)row(t.body,[x.input_index,x.event_id,x.timestamp,x.log_source]);p.append(data.events.length?t.wrap:empty('이 호스트에 연결된 이벤트 식별 정보가 없습니다.'));let q=panel('관련 탐지');for(const d of data.detections){let a=node('button',`${fmt(d.title)} · ${fmt(d.score)}점`,'link-button');a.type='button';a.addEventListener('click',async()=>{const request=++detailEpoch;try{let current=await get('/api/v1/endpoints/'+encodeURIComponent(e.endpoint_id),token);if(request!==detailEpoch)return;let latest=current.detections.find(item=>item.detection_id===d.detection_id);if(!latest)throw new Error('탐지 결과를 찾을 수 없습니다.');let previous=document.querySelector('#detail');if(previous)previous.remove();let detail=evidencePanel(latest,{source_events:current.events,event_refs:current.events},token);detail.id='detail';view.append(detail);detail.scrollIntoView({block:'start'})}catch(error){if(request===detailEpoch)state(error.message,true)}});q.append(a,node('p',`${source(d.source)} · ${fmt(d.status)}`,'meta'))}if(!data.detections.length)q.append(empty('관련 탐지가 없습니다.'));grid.append(p,q);view.append(grid)}
function renderDetections(data,token){let filters=node('div',null,'filters');const severity=node('select'),type=node('select'),query=node('input'),since=node('input'),until=node('input');query.placeholder='기법 또는 탐지명';since.type='date';until.type='date';for(const [v,label] of [['all','전체 심각도'],['high','높음'],['medium','중간'],['low','낮음']]){let o=node('option',label);o.value=v;severity.append(o)}for(const [v,label] of [['all','전체 출처'],['rule','규칙'],['semantic-baseline','키워드 기준선'],['correlation','상관분석']]){let o=node('option',label);o.value=v;type.append(o)}for(const [label,control] of [['심각도',severity],['탐지 출처',type],['탐지 유형',query],['분석 날짜 시작 (UTC)',since],['분석 날짜 종료 (UTC)',until]]){let l=node('label',label);l.append(control);filters.append(l)}view.append(filters);const p=panel('저장된 탐지 목록'),list=node('div');p.append(list);view.append(p);function draw(){detailEpoch++;const old=document.querySelector('#detail');if(old)old.remove();list.replaceChildren();let t=table(['심각도','탐지 결과','출처','상태','분석 시각']);let rows=data.detections.filter(d=>{let n=Number(d.score),s=n>=70?'high':n>=40?'medium':'low',batch=batchByDetection(data,d.detection_id),day=String(batch?.analyzed_at||'').slice(0,10),needle=query.value.trim().toLowerCase();return(severity.value==='all'||s===severity.value)&&(type.value==='all'||type.value===d.source)&&(!needle||`${d.technique||''} ${d.title||''}`.toLowerCase().includes(needle))&&(!since.value||day>=since.value)&&(!until.value||day<=until.value)});for(const d of rows){let b=node('button',`${fmt(d.technique)} · ${fmt(d.title)}`,'link-button');b.type='button';b.addEventListener('click',async()=>{const request=++detailEpoch;try{let current=await get('/api/v1/history',token);if(request!==detailEpoch)return;let latest=current.detections.find(item=>item.detection_id===d.detection_id);if(!latest)throw new Error('탐지 결과를 찾을 수 없습니다.');let old=document.querySelector('#detail');if(old)old.remove();let detail=evidencePanel(latest,batchByDetection(current,latest.detection_id),token);detail.id='detail';view.append(detail);detail.scrollIntoView({block:'start'})}catch(e){if(request===detailEpoch)state(e.message,true)}});row(t.body,[scoreTag(d.score),b,source(d.source),d.status,batchByDetection(data,d.detection_id)?.analyzed_at])}list.append(rows.length?t.wrap:empty(data.analyses.length?'조건에 맞는 탐지가 없습니다.':'아직 분석된 이력이 없습니다.'))}for(const control of [severity,type,query,since,until]){control.addEventListener('input',draw);control.addEventListener('change',draw)}draw();const model=panel('실험용 명령 모델 결과'),mt=table(['분석 시각','이벤트 ID','상태','분류','모델 점수']);let count=0;for(const batch of data.analyses){for(const result of batch.attack_model?.results||[]){row(mt.body,[batch.analyzed_at,result.event_id,result.status,result.label,result.score]);count++}}model.append(node('p','이진 분류 결과이며 ATT&CK 기법이나 공격 확률을 예측하지 않습니다. 내부 판단 근거는 제공되지 않습니다.','warning'),count?mt.wrap:empty('저장된 모델 결과가 없습니다.'));model.style.marginTop='16px';view.append(model)}
async function refresh(token){detailEpoch++;state('로컬 이력을 불러오는 중…');view.replaceChildren();load.disabled=true;try{if(page==='endpoint'){let id=decodeURIComponent(pagePath.slice(endpointPrefix.length));const data=await get('/api/v1/endpoints/'+encodeURIComponent(id),token);renderEndpoint(data,token);state('현재 분석 범위의 저장된 정보를 표시합니다.');return}let history=await get('/api/v1/history',token);if(page==='overview'){const [endpoints,pii,attack]=await Promise.all([get('/api/v1/endpoints',token),get('/api/v1/pii/status',token),get('/api/v1/attack-model/status',token)]);renderOverview(history,endpoints,pii,attack,token)}else if(page==='endpoints'){renderEndpoints(await get('/api/v1/endpoints',token))}else if(page==='detections')renderDetections(history,token);else{let p=panel('분석 이력');p.append(historyTable(history,token));view.append(p);let approvals=panel('승인 시뮬레이션');const items=history.detections.filter(x=>x.approval);for(const d of items)approvals.append(node('p',`${fmt(d.title)} · ${fmt(d.approval.approved_at)} · ${fmt(d.approval.analyst)} · ${fmt(d.approval.rationale)}`,'wrap-any'));if(!items.length)approvals.append(empty('저장된 승인 시뮬레이션이 없습니다.'));view.append(approvals)}state(history.analyses.length?`저장된 분석 ${history.analyses.length}건을 불러왔습니다. 실시간 상태가 아닙니다.`:'아직 분석된 이력이 없습니다. 로그 분석에서 합성 시나리오를 실행할 수 있습니다.')}catch(e){state(e.message,true)}finally{load.disabled=false}}
load.addEventListener('click',()=>{const token=tokenPrompt();if(token)refresh(token);else state('토큰을 입력하지 않아 이력을 조회하지 않았습니다.')});
</script></body></html>
