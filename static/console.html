<script>
'use strict';
if(location.pathname==='/' && location.hash){const paths={'#analysis':'/console/events','#result-section':'/console/detections','#history':'/console/history','#overview':'/console'};if(paths[location.hash])location.replace(paths[location.hash]);}
const pagePath=location.pathname.replace(/\/$/,'')||'/console';
const endpointPrefix='/console/endpoints/';
const page=pagePath.startsWith(endpointPrefix)?'endpoint':pagePath==='/console/endpoints'?'endpoints':pagePath==='/console/detections'?'detections':pagePath==='/console/events'?'events':pagePath==='/console/history'?'history':'overview';
const titles={overview:['OVERVIEW','관제 개요','저장된 분석 이력에서 확인 가능한 정보입니다.'],endpoints:['ENDPOINTS','관찰된 엔드포인트','같은 수집기와 호스트 이름으로 묶은 관찰입니다. 실제 장치 동일성은 확정하지 않습니다.'],endpoint:['ENDPOINT DETAIL','엔드포인트 상세','가명처리된 이벤트와 관련 탐지 결과입니다.'],detections:['DETECTIONS','탐지 결과','규칙·키워드·상관분석 결과와 관련 이벤트를 확인합니다.'],events:['EVENTS','수집 이벤트','저장된 가명처리 이벤트 식별 정보와 관련 경고입니다.'],history:['ANALYSIS HISTORY','분석 이력','저장된 분석과 승인 시뮬레이션을 확인합니다.']};
const [k,title,subtitle]=titles[page];document.querySelector('#kicker').textContent=k;document.querySelector('#title').textContent=title;document.querySelector('#subtitle').textContent=subtitle;document.querySelector(`[data-page="${page==='endpoint'?'endpoints':page}"]`)?.setAttribute('aria-current','page');
const statusEl=document.querySelector('#status'),view=document.querySelector('#view'),load=document.querySelector('#load');
let detailEpoch=0, detailPending=0, collectorDraft='';
function node(tag,text,cls){const e=document.createElement(tag);if(text!==undefined&&text!==null)e.textContent=String(text);if(cls)e.className=cls;return e}
function link(text,href){const e=node('a',text);e.href=href;return e}
function state(text,error=false){statusEl.textContent=text;statusEl.className=error?'state error':'state'}
function fmt(v){return v===undefined||v===null||v===''?'확인 불가':String(v)}
function scoreTag(score){const n=Number(score);return node('span',n>=70?'높음':n>=40?'중간':'낮음','tag '+(n>=70?'high':n>=40?'medium':'low'))}
function source(s){return ({rule:'규칙',correlation:'상관분석','semantic-baseline':'키워드 기준선'})[s]||fmt(s)}
function eventKind(e){if(e.sysmon_event_id===1)return 'Sysmon 1 · 프로세스';if(e.sysmon_event_id===3)return 'Sysmon 3 · 네트워크';if(e.outcome==='success')return '인증 성공';if(e.outcome==='failure')return '인증 실패';return '유형 확인 불가'}
function table(headers){const wrap=node('div',null,'table-wrap'),t=node('table',null,'table'),h=node('thead'),tr=node('tr'),body=node('tbody');for(const label of headers)tr.append(node('th',label));h.append(tr);t.append(h,body);wrap.append(t);return {wrap,body}}
function row(body,cells){let tr=node('tr');for(const cell of cells){let td=node('td');if(cell instanceof Node)td.append(cell);else td.textContent=fmt(cell);tr.append(td)}body.append(tr)}
function panel(title){let e=node('section',null,'panel');e.append(node('h2',title));return e}
function closeDetail(box){const b=node('button','상세 닫기','action');b.type='button';b.addEventListener('click',()=>box.remove());box.append(b)}
function empty(text){return node('div',text,'empty')}
let currentAnalyst='',csrfToken='',secretVisible=false,managementBusy=false;
async function get(path,token,options={}){const r=await fetch(path,{...options,credentials:'same-origin',headers:{...(options.method&&options.method!=='GET'?{'X-CSRF-Token':csrfToken}:{}),...options.headers}});if(r.status===401){if(typeof location.assign==='function')location.assign('/login');throw new Error('세션이 만료됐습니다. 다시 로그인하세요.')}if(!r.ok)throw new Error(r.status===503?'로컬 이력 저장소 또는 인증 설정을 확인하세요.':`요청 실패 (HTTP ${r.status})`);return r.json()}
async function getDetail(...args){detailPending++;try{return await get(...args)}finally{detailPending--}}
function batchByDetection(data,id){return data.analyses.find(a=>(a.detection_ids||[]).includes(id))}
function isUnambiguous(data,id){const scopes=new Set();for(const batch of data.analyses||[])for(const event of (batch.source_events?.length?batch.source_events:batch.event_refs||[]))if(event.event_id===id)scopes.add(event.endpoint_group||batch.analysis_id);return scopes.size===1} function eventLinked(data,batch,det,event){return (det.event_ids||[]).includes(event.event_id)&&((batch.detection_ids||[]).includes(det.detection_id)||isUnambiguous(data,event.event_id))} function linkedEvents(data,det){let events=[];for(const batch of data.analyses||[]){for(const event of (batch.source_events?.length?batch.source_events:batch.event_refs||[])){if(eventLinked(data,batch,det,event))events.push({...event,received_at:batch.received_at})}}return {source_events:events}}
function evidencePanel(det,batch,token){let box=panel('탐지 상세');box.classList.add('detail');closeDetail(box);box.append(node('h3',`${fmt(det.technique)} · ${fmt(det.title)}`));box.append(node('p',`출처 ${source(det.source)} · 점수 ${fmt(det.score)} · 호스트 ${fmt(det.host)}`,'meta'));box.append(node('p','탐지 근거'));let ul=node('ul');for(const x of det.evidence||[])ul.append(node('li',x));if(!ul.childNodes.length)ul.append(node('li','저장된 근거 없음'));box.append(ul,node('p','관련 이벤트 식별 정보 · 가명처리된 메타데이터','meta'));let events=(batch?.source_events?.length?batch.source_events:batch?.event_refs)||[];let related=events.filter(e=>(det.event_ids||[]).includes(e.event_id));if(!related.length)box.append(node('p','저장된 이벤트 연결 정보가 없습니다.','muted'));for(const e of related)box.append(node('p',`입력 ${fmt(e.input_index)} · 이벤트 ${fmt(e.event_id)} · 발생 시각 ${fmt(e.timestamp)} · 서버 수신 ${fmt(e.received_at)} · 출처 ${fmt(e.log_source)} · 수집기 ${fmt(e.collector_id)} · 인증 그룹 ${fmt(e.auth_correlation_group)} · 인증 결과 ${fmt(e.outcome)}`,'wrap-any'));box.append(node('p',`상태: ${fmt(det.status)} · 승인 조치는 시뮬레이션입니다.`));if(det.approval)box.append(node('p',`처리 ${fmt(det.approval.approved_at)} · 분석가 ${fmt(det.approval.analyst)} · 사유 ${fmt(det.approval.rationale)}`,'muted'));if(det.status!=='approved_for_simulated_response'){const b=node('button','시뮬레이션 승인','action');b.type='button';b.addEventListener('click',async()=>{const analyst=currentAnalyst;if(!analyst){state('로그인 세션을 확인하세요.',true);return;}const rationale=window.prompt('승인 사유를 입력하세요. 비밀값은 입력하지 마세요.');if(rationale===null)return;b.disabled=true;try{const result=await get(`/api/v1/detections/${encodeURIComponent(det.detection_id)}/approval`,token,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({analyst:analyst.trim(),rationale})});if(result.simulation_only!==true)throw new Error('시뮬레이션 결과를 확인하지 못했습니다.');state('승인 시뮬레이션이 저장됐습니다. 실제 차단은 수행하지 않았습니다.');await refresh(token)}catch(e){state(e.message,true);b.disabled=false}});box.append(b)}return box}

function renderDetections(data,token){let filters=node('div',null,'filters');const severity=node('select'),type=node('select'),query=node('input'),since=node('input'),until=node('input');query.placeholder='기법 또는 탐지명';since.type='date';until.type='date';for(const [v,label] of [['all','전체 심각도'],['high','높음'],['medium','중간'],['low','낮음']]){let o=node('option',label);o.value=v;severity.append(o)}for(const [v,label] of [['all','전체 출처'],['rule','규칙'],['semantic-baseline','키워드 기준선'],['correlation','상관분석']]){let o=node('option',label);o.value=v;type.append(o)}for(const [label,control] of [['심각도',severity],['탐지 출처',type],['탐지 유형',query],['분석 날짜 시작 (UTC)',since],['분석 날짜 종료 (UTC)',until]]){let l=node('label',label);l.append(control);filters.append(l)}view.append(filters);const p=panel('저장된 탐지 목록'),list=node('div');p.append(list);view.append(p);function draw(){detailEpoch++;const old=document.querySelector('#detail');if(old)old.remove();list.replaceChildren();let t=table(['심각도','탐지 결과','출처','상태','분석 시각']);let rows=data.detections.filter(d=>{let n=Number(d.score),s=n>=70?'high':n>=40?'medium':'low',batch=batchByDetection(data,d.detection_id),day=String(batch?.analyzed_at||'').slice(0,10),needle=query.value.trim().toLowerCase();return(severity.value==='all'||s===severity.value)&&(type.value==='all'||type.value===d.source)&&(!needle||`${d.technique||''} ${d.title||''}`.toLowerCase().includes(needle))&&(!since.value||day>=since.value)&&(!until.value||day<=until.value)});for(const d of rows){let b=node('button',`${fmt(d.technique)} · ${fmt(d.title)}`,'link-button');b.type='button';b.addEventListener('click',async()=>{const request=++detailEpoch;try{let current=await getDetail('/api/v1/history',token);if(request!==detailEpoch)return;let latest=current.detections.find(item=>item.detection_id===d.detection_id);if(!latest)throw new Error('탐지 결과를 찾을 수 없습니다.');let old=document.querySelector('#detail');if(old)old.remove();let detail=evidencePanel(latest,linkedEvents(current,latest),token); function renderShadow(data,token){const p=panel('CodeBERT 제안 순위');p.classList.add('model-panel');p.append(node('p','선택형 실험 모델의 제안입니다. 기존 탐지 점수와 승인 상태는 바뀌지 않습니다. 수집 이후 별도 상관분석으로 생성된 경고는 제안 순위에 포함되지 않을 수 있습니다.','shadow-note'));let count=0;const statuses={ready:'분석 가능',disabled:'비활성',error:'모델 로딩 실패',inference_error:'추론 실패'};for(const batch of data.analyses){const sh=batch.review_shadow;if(!sh)continue;count++;p.append(node('p',`분석 ${fmt(batch.analyzed_at)} · 모델 ${statuses[sh.state]||'상태 미확인'}${sh.fixture?' · 합성 검증용':''}`,'meta'));if((sh.events||[]).length){const eventsTable=table(['이벤트 ID','추론 상태','모델 점수']);for(const e of sh.events)row(eventsTable.body,[e.event_id,e.status,e.score]);p.append(eventsTable.wrap)}if(sh.state!=='ready'||!(sh.events||[]).some(e=>e.status==='ok')){p.append(node('p','AI 제안이 없어 기존 경보 순서를 사용합니다.','muted'));continue}const original=new Map((sh.current_order||[]).map((id,i)=>[id,i+1]));const scores=new Map((sh.events||[]).map(e=>[e.event_id,e]));const t=table(['기존 → 제안 순위','탐지','관련 이벤트·모델 결과']);let rows=0;for(const [rank,id] of (sh.proposed_order||[]).entries()){const d=data.detections.find(x=>x.detection_id===id);if(!d)continue;const button=node('button',fmt(d.title),'link-button');button.type='button';button.addEventListener('click',()=>openDetection(d,token));const ev=(d.event_ids||[]).map(id=>{const score=scores.get(id);return `${id} (${fmt(score?.status)}${Number.isFinite(score?.score)?` · ${score.score.toFixed(3)}`:''})`}).join(', ');row(t.body,[`${fmt(original.get(id))} → ${rank+1}`,button,ev||'관련 이벤트 없음']);rows++}p.append(rows?t.wrap:empty('저장된 순위에 연결된 탐지가 없습니다.'))}if(!count)p.append(empty('저장된 CodeBERT 결과가 없습니다.'));return p}
function renderEvents(data,token){let p=panel('수집 이벤트'),t=table(['이벤트 발생 시각','서버 수신 시각','입력 경로','호스트','이벤트 ID','이벤트 종류','출처','인증 결과','관련 경고']);let n=0;for(const batch of data.analyses){for(const e of (batch.source_events?.length?batch.source_events:batch.event_refs||[])){n++;let matches=data.detections.filter(d=>eventLinked(data,batch,d,e));let details=node('button',matches.length?`${matches.length}건 보기`:'없음','link-button');details.type='button';details.addEventListener('click',async()=>{const request=++detailEpoch;try{const fresh=await getDetail('/api/v1/history',token);if(request!==detailEpoch)return;const old=document.querySelector('#detail');if(old)old.remove();const panelDetail=panel('이벤트 관련 경고');panelDetail.id='detail';panelDetail.classList.add('detail');closeDetail(panelDetail);panelDetail.append(node('p',`이벤트 ${fmt(e.event_id)} · 서버 수신 ${fmt(batch.received_at)} · 출처 ${fmt(e.log_source)} · 수집기 ${fmt(e.collector_id)} · 인증 그룹 ${fmt(e.auth_correlation_group)}`,'wrap-any'));for(const det of fresh.detections.filter(d=>eventLinked(fresh,batch,d,e))){let b=node('button',`${fmt(det.title)} · ${source(det.source)}`,'link-button');b.type='button';b.addEventListener('click',async()=>{const request=++detailEpoch;try{const current=await getDetail('/api/v1/history',token);if(request!==detailEpoch)return;const latest=current.detections.find(x=>x.detection_id===det.detection_id);if(!latest)throw new Error('탐지 결과를 찾을 수 없습니다.');const old=document.querySelector('#detail');if(old)old.remove();let v=evidencePanel(latest,linkedEvents(current,latest),token);v.id='detail';view.append(v);v.scrollIntoView({block:'start'})}catch(error){if(request===detailEpoch)state(error.message,true)}});panelDetail.append(b,node('p',`상태 ${fmt(det.status)} · 점수 ${fmt(det.score)}`,'meta'))}if(!fresh.detections.some(d=>eventLinked(fresh,batch,d,e)))panelDetail.append(empty('관련 경고가 없습니다.'));view.append(panelDetail);panelDetail.scrollIntoView({block:'start'})}catch(err){if(request===detailEpoch)state(err.message,true)}});row(t.body,[e.timestamp,batch.received_at,batch.received_at?'자동 수집':'수동 / 기존 이력',e.host,e.event_id,eventKind(e),e.log_source,e.outcome,details])}}p.append(n?t.wrap:empty('수집된 이벤트 식별 정보가 없습니다.'));view.append(p)}
let monitorToken=null,monitorTimer=null,monitorBusy=false,monitorHadFailure=false,monitorSequence=0;
function monitorBlocked(){return secretVisible||document.querySelector('#history-detail')||document.querySelector('#detail')||detailPending||(document.activeElement&&view.contains(document.activeElement))}
async function refresh(token,automatic=false){
 if(secretVisible){state('인증 정보를 안전하게 저장한 뒤 확인 완료를 누르세요.');return}
 if(managementBusy){state('수집기 인증 변경을 처리 중입니다.');return}
 if(monitorBusy&&automatic)return;
 const run=++monitorSequence;
 if(automatic&&monitorBlocked()){
  monitorBusy=true;
  try{const latest=await get('/api/v1/collectors',token);if(run!==monitorSequence)return;const counts={running:0,stopped:0,error:0};let stale=0;for(const c of latest.collectors||[]){if(c.reported_state in counts)counts[c.reported_state]++;const age=Date.now()-Date.parse(c.last_heartbeat_at||'');if(Number.isFinite(age)&&age>30000)stale++}const message=`수집기 마지막 보고: 실행 ${counts.running} · 중단 ${counts.stopped} · 오류 ${counts.error} · 30초 이상 미보고 ${stale}`;state((monitorHadFailure?'화면 연결 복구됨. ':'화면 연결됨. ')+message+' · 상세와 목록의 갱신은 일시 중지 중');monitorHadFailure=false}
  catch(e){if(run===monitorSequence){monitorHadFailure=true;state('화면 연결 오류: '+e.message+' 5초 후 재연결을 시도합니다. 기존 표시는 최신 정보가 아닐 수 있습니다.',true)}}
  finally{if(run===monitorSequence)monitorBusy=false}
  return
 }
 const cycle=++detailEpoch;monitorBusy=true;load.disabled=true;
 if(!automatic)state('로컬 이력을 불러오는 중…');
 try{
  if(page==='endpoint'){let id=decodeURIComponent(pagePath.slice(endpointPrefix.length));const data=await get('/api/v1/endpoints/'+encodeURIComponent(id),token);if(run!==monitorSequence)return;view.replaceChildren();renderEndpoint(data,token);state('현재 분석 범위의 저장된 정보를 표시합니다.');return}
  let history=await get('/api/v1/history',token),endpoints,pii,attack,collectors;
  if(page==='overview')[endpoints,pii,attack,collectors]=await Promise.all([get('/api/v1/endpoints',token),get('/api/v1/pii/status',token),get('/api/v1/attack-model/status',token),get('/api/v1/collectors',token)]);
  else if(page==='endpoints')[endpoints,collectors]=await Promise.all([get('/api/v1/endpoints',token),get('/api/v1/collectors',token)]);
  if(run!==monitorSequence)return;
  if(automatic&&(cycle!==detailEpoch||monitorBlocked())){state('화면 연결됨. 상세와 목록의 갱신은 일시 중지 중');return}
  view.replaceChildren();
  if(page==='overview'){renderOverview(history,endpoints,pii,attack,token);renderCollectors(collectors)}
  else if(page==='endpoints'){renderEndpoints(endpoints);renderCollectors(collectors)}
  else if(page==='detections')renderDetections(history,token);
  else if(page==='events')renderEvents(history,token);
  else{let p=panel('분석 이력');p.append(historyTable(history,token));view.append(p);let approvals=panel('승인 시뮬레이션');const items=history.detections.filter(x=>x.approval);for(const d of items)approvals.append(node('p',`${fmt(d.title)} · ${fmt(d.approval.approved_at)} · ${fmt(d.approval.analyst)} · ${fmt(d.approval.rationale)}`,'wrap-any'));if(!items.length)approvals.append(empty('저장된 승인 시뮬레이션이 없습니다.'));view.append(approvals)}
  const prefix=monitorHadFailure?'화면 연결 복구됨. ':'화면 연결됨. ';monitorHadFailure=false;
  state(prefix+(history.analyses.length?`저장된 분석 ${history.analyses.length}건.`:'아직 분석된 이력이 없습니다.')+(['overview','events'].includes(page)?' 5초마다 갱신합니다.':' 수동으로 새로 불러올 수 있습니다.'));
 }catch(e){if(run===monitorSequence){monitorHadFailure=true;state('화면 연결 오류: '+e.message+(['overview','events'].includes(page)?' 5초 후 재연결을 시도합니다. 기존 표시는 최신 정보가 아닐 수 있습니다.':''),true)}}
 finally{if(run===monitorSequence){load.disabled=secretVisible;monitorBusy=false}}
}
load.addEventListener('click',()=>{monitorToken='session';refresh(monitorToken);if(['overview','events'].includes(page)&&!monitorTimer&&typeof setInterval==='function')monitorTimer=setInterval(()=>{if(monitorToken)refresh(monitorToken,true)},5000)});
async function startSession(){try{const session=await get('/api/v1/session','session');currentAnalyst=session.analyst;csrfToken=session.csrf_token;document.querySelector('#analyst-name').textContent=`분석가 ${currentAnalyst}`;document.querySelector('#logout').addEventListener('click',async()=>{try{await get('/api/v1/logout','session',{method:'POST'});location.assign('/login')}catch(e){state(e.message,true)}});load.click()}catch(e){state(e.message,true)}}
if(typeof window.addEventListener==='function')window.addEventListener('DOMContentLoaded',startSession);
</script></body></html>
